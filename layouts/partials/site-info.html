{{- $file := site.Params.siteInfoFile | default "author/site-info.md" -}}
{{- $title := site.Params.siteInfoTitle | default "Site info" -}}
{{- if fileExists $file -}}
{{- with (readFile $file | markdownify) -}}
<aside class="window site-info md" data-window-title="{{ $title }}" aria-label="{{ $title }}">
    {{ . }}
</aside>
{{- end -}}
{{- end -}}
